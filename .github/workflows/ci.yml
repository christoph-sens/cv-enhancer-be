name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shared CI, see https://github.com/christoph-sens/ci-workflows
  ci:
    uses: christoph-sens/ci-workflows/.github/workflows/gradle-ci.yml@9ca7ab1c7d560a03852a1e10afd355f4e80d234b # v1.5.3
    permissions:
      contents: write        # dependency submission on push to main
      security-events: write # CodeQL and Trivy results
    with:
      docker-jar-dir: bootstrap/build/libs
