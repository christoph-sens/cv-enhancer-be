name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shared CI, see https://github.com/christoph-sens/ci-workflows
  ci:
    uses: christoph-sens/ci-workflows/.github/workflows/gradle-ci.yml@fe6156f05c0d0bffca65a102871d211b55b01b6d # dependency-review branch (test)
    permissions:
      contents: write        # dependency submission on push to main
      security-events: write # CodeQL and Trivy results
    with:
      docker-jar-dir: bootstrap/build/libs
