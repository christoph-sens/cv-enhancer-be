name: Release

on:
  push:
    tags: ["v*"]
  # Manual run = dry run: builds, tests and scans the image, never pushes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Shared release, see https://github.com/christoph-sens/ci-workflows
  release:
    uses: christoph-sens/ci-workflows/.github/workflows/container-release.yml@9ca7ab1c7d560a03852a1e10afd355f4e80d234b # v1.5.3
    permissions:
      contents: write          # GitHub release
      packages: write          # push to GHCR
      id-token: write          # Sigstore signing of the attestations
      attestations: write
      artifact-metadata: write
    with:
      docker-jar-dir: bootstrap/build/libs
